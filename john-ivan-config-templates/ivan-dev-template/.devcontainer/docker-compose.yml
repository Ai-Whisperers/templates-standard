version: '3.8'

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - dev-network
    environment:
      - PYTHONPATH=/workspace
      - NODE_ENV=development
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

# CUSTOMIZATION NOTES:
# - Add additional services (postgres, mongodb, elasticsearch, etc.)
# - Configure environment variables
# - Update volume paths
# - Add health checks
# - Configure network settings
