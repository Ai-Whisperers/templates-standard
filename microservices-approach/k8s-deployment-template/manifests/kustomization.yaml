apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${NAMESPACE}

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# Optional: Add common labels to all resources
commonLabels:
  app: ${APP_NAME}
  managed-by: kustomize

# Optional: Add namespace to all resources
# namespace: ${NAMESPACE}

# Optional: ConfigMap generator for environment-specific configs
# configMapGenerator:
# - name: ${APP_NAME}-config
#   literals:
#   - APP_ENV=production
#   - LOG_LEVEL=info
