apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: multi-service

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml

# Common labels applied to all resources
commonLabels:
  app: multi-service-demo
  managed-by: kustomize

# Deployment order: backend before frontend
# Kustomize applies in order listed above

# Optional: Add resource limits via patch
# patches:
# - patch: |-
#     - op: replace
#       path: /spec/replicas
#       value: 3
#   target:
#     kind: Deployment
#     name: frontend
