apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-service-config
  namespace: multi-service
data:
  # Shared configuration across all services
  APP_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Backend configuration
  BACKEND_MAX_WORKERS: "4"
  BACKEND_CACHE_SIZE: "1000"

  # Frontend configuration
  BACKEND_URL: "http://backend-service:8080"
  FRONTEND_TIMEOUT: "30"
