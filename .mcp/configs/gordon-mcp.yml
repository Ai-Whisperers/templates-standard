version: "3.8"

services:
  # Built-in filesystem server for reading project files
  filesystem:
    image: mcp/filesystem
    volumes:
      - .:/data:ro  # Read-only access to project
    environment:
      - ALLOWED_PATHS=/data
      - ALLOWED_EXTENSIONS=.md,.json,.yml,.yaml,.py,.js,.ts,.txt
    restart: unless-stopped

