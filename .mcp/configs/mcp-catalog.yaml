# MCP Server Catalog for AI Whisperers Standards Repository
# This file defines available MCP tools and their capabilities

version: "1.0"
catalog_name: "AI Whisperers Standards Validation"
description: "MCP servers for validating documentation and templates against AI Whisperers standards"

servers:
  # Built-in Filesystem Server
  - name: filesystem
    type: built-in
    image: mcp/filesystem
    description: "Read and explore project files"
    capabilities:
      - read_files
      - list_directories
      - search_files
    restrictions:
      access_mode: read-only
      allowed_paths:
        - /data
      allowed_extensions:
        - .md
        - .json
        - .yml
        - .yaml
        - .py
        - .js
        - .ts
        - .txt
      max_file_size: 10485760  # 10MB

  # Custom Standards Validator (Future)
  # Uncomment when implemented
  # - name: standards-validator
  #   type: custom
  #   build_context: .mcp/servers/standards-validator
  #   description: "Validate documentation and templates against AI Whisperers standards"
  #   capabilities:
  #     - validate_documentation
  #     - check_documentation_ratio
  #     - validate_hierarchy
  #     - check_template_consistency
  #     - validate_toon_format
  #     - analyze_cognitive_flow
  #   configuration:
  #     project_type: standardization-template
  #     validation_mode: strict
  #   dependencies:
  #     - filesystem

tools:
  # Filesystem Tools
  - name: read_file
    server: filesystem
    description: "Read contents of a file"
    parameters:
      - name: file_path
        type: string
        required: true
        description: "Path to file relative to project root"
    returns:
      type: string
      description: "File contents"

  - name: list_directory
    server: filesystem
    description: "List files and folders in a directory"
    parameters:
      - name: directory_path
        type: string
        required: true
        description: "Path to directory relative to project root"
      - name: recursive
        type: boolean
        required: false
        default: false
        description: "List recursively"
    returns:
      type: array
      description: "List of file and directory names"

  - name: search_files
    server: filesystem
    description: "Search for files matching a pattern"
    parameters:
      - name: pattern
        type: string
        required: true
        description: "Glob pattern to match files"
      - name: content_search
        type: string
        required: false
        description: "Search file contents for text"
    returns:
      type: array
      description: "List of matching file paths"

