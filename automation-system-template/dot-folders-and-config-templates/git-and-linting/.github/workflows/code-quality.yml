name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ruff mypy bandit

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy . --ignore-missing-imports

      - name: Run Bandit (security)
        run: bandit -r . -ll

  lint-javascript:
    name: JavaScript/TypeScript Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present || echo "No lint configured"

      - name: Run Prettier
        run: npx prettier --check . || echo "No prettier configured"

# CUSTOMIZATION NOTES:
# - Add your linting tools (eslint, prettier, ruff, mypy, etc.)
# - Configure tool-specific settings (.eslintrc, mypy.ini, etc.)
# - Add security scanners (bandit, safety, snyk)
# - Add formatting checks
